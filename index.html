    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          function MockViteHmrWS(url, protocols) {
            var target = new EventTarget();
            target.url = url;
            target.protocols = protocols;
            target.readyState = 1;
            target.OPEN = 1;
            target.CLOSED = 3;
            target.CLOSING = 2;
            target.CONNECTING = 0;
            target.binaryType = 'blob';
            target.bufferedAmount = 0;
            target.extensions = '';
            target.protocol = typeof protocols === 'string' ? protocols : (protocols && protocols[0]) || '';
            target.send = function() {};
            target.close = function() {};
            setTimeout(function() {
              var evt = new Event('open');
              if (typeof target.onopen === 'function') target.onopen(evt);
              target.dispatchEvent(evt);
            }, 0);
            return target;
          }
          var CustomWS = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))) {
              return new MockViteHmrWS(url, protocols);
            }
            return Reflect.construct(NativeWS, [url, protocols]);
          };
          CustomWS.prototype = NativeWS.prototype;
          CustomWS.OPEN = 1;
          CustomWS.CLOSED = 3;
          CustomWS.CLOSING = 2;
          CustomWS.CONNECTING = 0;
          window.WebSocket = CustomWS;
        }

        var origConsoleErr = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            str += (a && (a.message || a.stack || '' + a)) || '';
          }
          if (str.indexOf('WebSocket closed without opened') !== -1 || str.indexOf('[vite] failed to connect to websocket') !== -1) {
            return;
          }
          return origConsoleErr.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || reason.stack || (typeof reason === 'string' ? reason : ''));
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event.message || '') + ' ' + (event.filename || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
